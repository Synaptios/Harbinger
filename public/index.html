<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f4">
  <title>Harbinger</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>Harbinger</h1>
      <button type="button" class="secondary-button" id="new-chat" disabled>New chat</button>
    </div>
  </header>

  <main class="workspace">
    <aside aria-label="Chat settings">
      <details class="settings" id="settings" open>
        <summary>Settings</summary>
        <div class="settings-content">
          <div class="setting">
            <label for="model-select">Model</label>
            <input id="model-search" type="search" aria-label="Filter models" aria-controls="model-select"
                   placeholder="Search models" autocomplete="off" disabled>
            <select id="model-select" aria-describedby="model-status" disabled>
              <option value="">Loading models…</option>
            </select>
            <p class="hint" id="model-status" role="status"></p>
            <ul id="catalog-errors" class="catalog-errors" aria-live="polite" hidden></ul>
            <button type="button" class="text-button" id="reload-models" hidden>Retry loading models</button>
          </div>
          <div class="setting">
            <label for="system-prompt">System prompt</label>
            <textarea id="system-prompt" rows="5" aria-describedby="prompt-hint"
                      placeholder="Optional instructions for the model"></textarea>
            <p class="hint" id="prompt-hint">Changes apply starting with your next message.</p>
          </div>
        </div>
      </details>
    </aside>

    <section class="chat" aria-label="Chat">
      <span id="chat-status" class="visually-hidden" role="status"></span>
      <div class="transcript" id="transcript" role="log" aria-label="Conversation" tabindex="0">
        <div class="empty-state" id="empty-state">
          <h2>Start a conversation</h2>
        </div>
      </div>
      <form class="composer" id="chat-form">
        <label class="visually-hidden" for="chat-input">Message</label>
        <textarea id="chat-input" rows="2" aria-describedby="key-hint"
                  placeholder="Write a message…" required disabled></textarea>
        <div class="composer-controls">
          <p class="hint" id="key-hint"><kbd>Shift</kbd> + <kbd>Enter</kbd> for a new line</p>
          <button class="send-button" type="submit" id="send-message" disabled>Send</button>
        </div>
        <p class="chat-error" id="chat-error" role="alert"></p>
      </form>
    </section>
  </main>
</body>
</html>
